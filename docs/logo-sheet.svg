<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <g id="mark">
      <rect x="2" y="2" width="60" height="60" rx="16" class="badge"/>
      <path d="M14 40 L32 16.5 L50 40" fill="none" class="chevron" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 49.5 q6.5 -7 13 0 t13 0 t12 0" fill="none" class="wave" stroke-width="4.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1000" height="830" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="15" font-weight="bold" fill="#333" letter-spacing="3">HI-TRAIL · ЛОГОТИП · КОНЦЕПТ v1</text>
  <text x="40" y="68" font-size="12" fill="#888">Знак: шеврон-подъём (гора · трейл · вело) из сигнальной ленты + волна Днестра. Слева — версия в каждой из четырёх тем.</text>

  <!-- ===== Тема 1: Сигнальная лента ===== -->
  <g transform="translate(40,90)">
    <rect width="440" height="150" rx="18" fill="#0F2A1D"/>
    <g transform="translate(28,43) scale(1.0)">
      <style>.t1 .badge{fill:#16382A;stroke:rgba(255,255,255,.16);stroke-width:1.5}.t1 .chevron{stroke:#FF4D00}.t1 .wave{stroke:rgba(255,255,255,.92)}</style>
      <g class="t1"><use href="#mark"/></g>
    </g>
    <text x="110" y="83" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1">HI-<tspan fill="#FF4D00">TRAIL</tspan></text>
    <text x="112" y="106" font-size="11.5" fill="#9DB3A2" letter-spacing="2.5">ЛИГА СПОРТА И ТУРИЗМА</text>
    <text x="28" y="132" font-size="11" fill="#6d8577">01 · Сигнальная лента — основная</text>
  </g>

  <!-- ===== Тема 2: Днестр ===== -->
  <g transform="translate(520,90)">
    <rect width="440" height="150" rx="18" fill="#0A2233"/>
    <g transform="translate(28,43)">
      <style>.t2 .badge{fill:#123249;stroke:rgba(255,255,255,.16);stroke-width:1.5}.t2 .chevron{stroke:#00A896}.t2 .wave{stroke:rgba(255,255,255,.92)}</style>
      <g class="t2"><use href="#mark"/></g>
    </g>
    <text x="110" y="83" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1">HI-<tspan fill="#00A896">TRAIL</tspan></text>
    <text x="112" y="106" font-size="11.5" fill="#8FB2C4" letter-spacing="2.5">ЛИГА СПОРТА И ТУРИЗМА</text>
    <text x="28" y="132" font-size="11" fill="#5f8296">02 · Днестр</text>
  </g>

  <!-- ===== Тема 3: Ночной старт ===== -->
  <g transform="translate(40,260)">
    <rect width="440" height="150" rx="18" fill="#080C09"/>
    <g transform="translate(28,43)">
      <style>.t3 .badge{fill:#121A13;stroke:rgba(255,255,255,.14);stroke-width:1.5}.t3 .chevron{stroke:#C8F231}.t3 .wave{stroke:rgba(255,255,255,.85)}</style>
      <g class="t3"><use href="#mark"/></g>
    </g>
    <text x="110" y="83" font-size="34" font-weight="900" fill="#EAF2E8" letter-spacing="1">HI-<tspan fill="#C8F231">TRAIL</tspan></text>
    <text x="112" y="106" font-size="11.5" fill="#8FA091" letter-spacing="2.5">ЛИГА СПОРТА И ТУРИЗМА</text>
    <text x="28" y="132" font-size="11" fill="#66735f">03 · Ночной старт — саб-бренд ночных событий</text>
  </g>

  <!-- ===== Тема 4: Степной грунт ===== -->
  <g transform="translate(520,260)">
    <rect width="440" height="150" rx="18" fill="#241A12"/>
    <g transform="translate(28,43)">
      <style>.t4 .badge{fill:#33261A;stroke:rgba(255,255,255,.16);stroke-width:1.5}.t4 .chevron{stroke:#E8871E}.t4 .wave{stroke:rgba(255,255,255,.9)}</style>
      <g class="t4"><use href="#mark"/></g>
    </g>
    <text x="110" y="83" font-size="34" font-weight="900" fill="#FFFDF8" letter-spacing="1">HI-<tspan fill="#E8871E">TRAIL</tspan></text>
    <text x="112" y="106" font-size="11.5" fill="#B8A48F" letter-spacing="2.5">ЛИГА СПОРТА И ТУРИЗМА</text>
    <text x="28" y="132" font-size="11" fill="#8a7864">04 · Степной грунт</text>
  </g>

  <!-- ===== Моно и светлый фон ===== -->
  <g transform="translate(40,430)">
    <rect width="920" height="170" rx="18" fill="#F4F6F0" stroke="#DCE2D4"/>
    <text x="24" y="34" font-size="12" font-weight="bold" fill="#5C6B5E" letter-spacing="2">ИНВЕРСИЯ И МОНОХРОМ · для печати, гравировки медалей, штампов</text>

    <!-- цветной на светлом -->
    <g transform="translate(30,58)">
      <style>.t5 .badge{fill:#0F2A1D}.t5 .chevron{stroke:#FF4D00}.t5 .wave{stroke:#FFFFFF}</style>
      <g class="t5"><use href="#mark"/></g>
    </g>
    <text x="108" y="98" font-size="26" font-weight="900" fill="#0F2A1D">HI-<tspan fill="#FF4D00">TRAIL</tspan></text>

    <!-- монохром тёмный -->
    <g transform="translate(330,58)">
      <style>.t6 .badge{fill:none;stroke:#0F2A1D;stroke-width:4}.t6 .chevron{stroke:#0F2A1D}.t6 .wave{stroke:#0F2A1D}</style>
      <g class="t6"><use href="#mark"/></g>
    </g>
    <text x="408" y="98" font-size="26" font-weight="900" fill="#0F2A1D">HI-TRAIL</text>

    <!-- знак-соло (аватар / фавикон) -->
    <g transform="translate(650,52) scale(1.2)">
      <style>.t7 .badge{fill:#0F2A1D}.t7 .chevron{stroke:#FF4D00}.t7 .wave{stroke:#FFFFFF}</style>
      <g class="t7"><use href="#mark"/></g>
    </g>
    <text x="740" y="82" font-size="12" fill="#5C6B5E">Знак-соло:</text>
    <text x="740" y="100" font-size="12" fill="#5C6B5E">фавикон, аватар Telegram,</text>
    <text x="740" y="118" font-size="12" fill="#5C6B5E">стартовые номера, медали</text>
  </g>


  <!-- ===== Наследие: рука «Hi!» → стикер «Дай пять» ===== -->
  <g transform="translate(40,620)">
    <rect width="920" height="160" rx="18" fill="#FFFFFF" stroke="#DCE2D4"/>
    <text x="24" y="34" font-size="12" font-weight="bold" fill="#5C6B5E" letter-spacing="2">НАСЛЕДИЕ · рука из старого лого перерождается в стикер «ДАЙ ПЯТЬ»</text>

    <!-- стикер: ладонь в круге, тема «лента» -->
    <g transform="translate(50,52)">
      <circle cx="45" cy="45" r="45" fill="#FF4D00"/>
      <circle cx="45" cy="45" r="45" fill="none" stroke="#0F2A1D" stroke-width="3"/>
      <path d="M28 62 V40 a4.5 4.5 0 0 1 9 0 V33 a4.5 4.5 0 0 1 9 0 v-3 a4.5 4.5 0 0 1 9 0 v6 a4.5 4.5 0 0 1 9 0 v14 c0 12 -7 20 -18 20 c-8 0 -13 -3 -16 -8 l-6 -9 a4.3 4.3 0 0 1 7 -5 z"
            fill="#FFFFFF" stroke="#0F2A1D" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- стикер: тема «днестр» -->
    <g transform="translate(180,52)">
      <circle cx="45" cy="45" r="45" fill="#00A896"/>
      <path d="M28 62 V40 a4.5 4.5 0 0 1 9 0 V33 a4.5 4.5 0 0 1 9 0 v-3 a4.5 4.5 0 0 1 9 0 v6 a4.5 4.5 0 0 1 9 0 v14 c0 12 -7 20 -18 20 c-8 0 -13 -3 -16 -8 l-6 -9 a4.3 4.3 0 0 1 7 -5 z"
            fill="#FFFFFF" stroke="#0A2233" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- стикер: контурный, для печати -->
    <g transform="translate(310,52)">
      <circle cx="45" cy="45" r="43.5" fill="none" stroke="#0F2A1D" stroke-width="3"/>
      <path d="M28 62 V40 a4.5 4.5 0 0 1 9 0 V33 a4.5 4.5 0 0 1 9 0 v-3 a4.5 4.5 0 0 1 9 0 v6 a4.5 4.5 0 0 1 9 0 v14 c0 12 -7 20 -18 20 c-8 0 -13 -3 -16 -8 l-6 -9 a4.3 4.3 0 0 1 7 -5 z"
            fill="none" stroke="#0F2A1D" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <text x="440" y="66" font-size="13" fill="#5C6B5E">Смысл «Hi!» и финишного «дай пять» сохраняется, но живёт не в основном знаке,</text>
    <text x="440" y="86" font-size="13" fill="#5C6B5E">а в саб-графике: фан-забеги 500 м, детские категории, волонтёрская программа,</text>
    <text x="440" y="106" font-size="13" fill="#5C6B5E">наклейки на медали финишёров и рамки для фото.</text>
    <text x="440" y="134" font-size="12" fill="#999">Основной знак (шеврон + волна) — про спорт и локации; рука — про эмоцию и сообщество.</text>
  </g>

  <text x="40" y="810" font-size="11" fill="#999">Примечание: слово набрано системным шрифтом для превью; в финальной версии леттеринг — Unbounded Black, переведённый в кривые.</text>
</svg>
